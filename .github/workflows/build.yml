name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config \
            libfreetype-dev libgl-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxkbcommon-dev \
            libwayland-dev wayland-protocols libdecor-0-dev libegl-dev \
            libdbus-1-dev libibus-1.0-dev \
            dpkg-dev rpm

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Package (.tar.gz, .deb, .rpm)
        run: cpack --config build/CPackConfig.cmake -B build/packages

      - name: Check packages
        run: |
          ls -l build/packages
          dpkg-deb --info build/packages/*.deb
          dpkg-deb --contents build/packages/*.deb
          rpm -qip build/packages/*.rpm
          rpm -qlp build/packages/*.rpm

      - uses: actions/upload-artifact@v4
        with:
          name: imserial-linux-x86_64
          path: |
            build/packages/*.tar.gz
            build/packages/*.deb
            build/packages/*.rpm
          if-no-files-found: error

  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        # Static CRT so the zip runs without the VC++ redistributable.
        run: >
          cmake -S . -B build -A x64
          -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (.zip)
        run: cpack --config build/CPackConfig.cmake -C Release -B build/packages

      - uses: actions/upload-artifact@v4
        with:
          name: imserial-windows-x64
          path: build/packages/*.zip
          if-no-files-found: error

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
